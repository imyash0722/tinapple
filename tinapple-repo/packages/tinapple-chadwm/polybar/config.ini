;==========================================================
;
;   Tinapple Chadwm - Polybar Configuration
;   Modules: cpu, mem, disk, net, tinapple-dash status, power profile
;
;==========================================================

[colors]
background = #1a1b26
background-alt = #24283b
foreground = #c0caf5
primary = #7aa2f7
secondary = #bb9af7
alert = #f7768e
disabled = #565f89
green = #9ece6a
yellow = #e0af68
cyan = #7dcfff
peach = #ff9e64

[bar/main]
width = 100%
height = 28pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
line-color = ${colors.primary}

border-size = 0pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "JetBrainsMono Nerd Font:style=Bold:size=10;3"

modules-left = xworkspaces xwindow
modules-center = date tinapple-dash
modules-right = filesystem cpu memory network power-profile pulseaudio

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = generic

; ==========================================================
; WORKSPACES & WINDOW
; ==========================================================

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
label-foreground = ${colors.disabled}

; ==========================================================
; DISK / FILESYSTEM
; ==========================================================

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.yellow}
label-mounted = %free%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

; ==========================================================
; CPU
; ==========================================================

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

; ==========================================================
; MEMORY
; ==========================================================

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.secondary}
label = %percentage_used%%

; ==========================================================
; NETWORK
; ==========================================================

[module/network]
type = internal/network
interface-type = wired,wireless
interval = 3.0

format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.green}
format-connected = <label-connected>
label-connected = %netspeed%

format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = ${colors.alert}
format-disconnected = <label-disconnected>
label-disconnected = off

; ==========================================================
; TINAPPLE-DASH STATUS
; ==========================================================

[module/tinapple-dash]
type = custom/script
exec = ~/.config/polybar/scripts/tinapple-dash-status.sh
interval = 2
format-prefix-foreground = ${colors.cyan}
format = <label>
label = %output%
click-left = tinapple-session toggle
click-right = rofi -show tinapple-actions

; ==========================================================
; POWER PROFILE
; ==========================================================

[module/power-profile]
type = custom/script
exec = ~/.config/polybar/scripts/power-profile.sh
interval = 4
format = <label>
label = %output%
click-left = ~/.config/polybar/scripts/power-profile.sh toggle

; ==========================================================
; DATE & TIME
; ==========================================================

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}

; ==========================================================
; AUDIO
; ==========================================================

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.cyan}
format-volume = <label-volume>

label-volume = %percentage%%

format-muted-prefix = "󰝟 "
format-muted-prefix-foreground = ${colors.disabled}
label-muted = muted
label-muted-foreground = ${colors.disabled}

[settings]
screenchange-reload = true
pseudo-transparency = true
