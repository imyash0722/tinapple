[package]
name = "tinapple-hub"
version = "1.0.0"
description = "Tinapple Homelab Appliance Hub Desktop Client"
authors = ["Tinapple Team <imyashlinux@gmail.com>"]
license = "MIT"
repository = "https://github.com/imyash0722/tinapple"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
