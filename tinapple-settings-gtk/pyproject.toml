[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinapple-settings"
version = "0.1.0"
description = "Tinapple OS Step-by-Step GTK4 Control Center & Appliance Manager"
authors = [{ name = "Tinapple Team" }]
license = { text = "MIT" }
dependencies = [
    "pygobject>=3.42",
]

[project.scripts]
tinapple-settings = "tinapple_settings.main:main"
chaddy-settings = "tinapple_settings.main:main"
