# Tinapple Appliance Services Native Reverse Proxy Routes
# Reverse proxies all appliances behind a unified HTTP / Tailscale entrypoint with lossless compression.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 0;

    # 1. Dashboard & Hub (Default Fallback)
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Immutable Cache Fast-Path for Dashboard Static Assets
    location /assets/ {
        proxy_pass http://127.0.0.1:8088/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Jellyfin Home Theater
    location = /jellyfin { return 308 /jellyfin/$is_args$args; }
    location ^~ /jellyfin/ {
        proxy_pass http://127.0.0.1:8096/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header X-Forwarded-Prefix /jellyfin;
        proxy_redirect ~^(/.*)$ /jellyfin$1;
        proxy_cookie_path / /jellyfin/;
    }

    # 4. Suwayomi Manga Server
    location = /suwayomi { return 308 /suwayomi/$is_args$args; }
    location ^~ /suwayomi/ {
        proxy_pass http://127.0.0.1:4567/;
        proxy_http_version 1.1;
