        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header X-Forwarded-Prefix /suwayomi;
        proxy_redirect ~^(/.*)$ /suwayomi$1;
        proxy_cookie_path / /suwayomi/;
    }

    # 5. Suwayomi GraphQL API Fast-Path
    location /api/graphql {
        proxy_pass http://127.0.0.1:4567/api/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Suwayomi Manga Thumbnails Fast-Path (direct sendfile with cache)
    location ~ ^/api/v1/manga/([0-9]+)/thumbnail$ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 7. qBittorrent Web UI
    location = /qbittorrent { return 308 /qbittorrent/$is_args$args; }
    location ^~ /qbittorrent/ {
