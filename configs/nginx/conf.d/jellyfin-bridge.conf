# Jellyfin Emby Compatibility Bridge on Ports 8096 and 8095
# Translates legacy /emby/* API calls (from Tsukimi, Ombi, etc.) to native Jellyfin endpoints.

server {
    listen 8096;
    listen [::]:8096;
    listen 8095;
    listen [::]:8095;
    server_name _;
    client_max_body_size 0;

    # Emby compatibility rewrite for Tsukimi, Ombi, and third-party clients
    location ^~ /emby/ {
        rewrite ^/emby/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
