# Native NGINX configuration for Tinapple OS
# Provides high-performance reverse proxying, Gzip transfer compression, and WebSocket tunneling.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    proxy_buffering off;
    proxy_cache off;

    # Gzip Lossless Transfer Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon
        application/x-subrip
        text/vtt
        application/vnd.apple.mpegurl;

    # Include all modular reverse proxy route configurations
    include /etc/nginx/conf.d/*.conf;
}
