LABEL tinapple_nbd
TEXT HELP
Boot tinapple OS live environment using NBD.
ENDTEXT
MENU LABEL tinapple OS Live (NBD, %ARCH%)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cow_spacesize=1G quiet splash loglevel=3
