LABEL tinapple
TEXT HELP
Boot tinapple OS live and installation environment on BIOS.
ENDTEXT
MENU LABEL tinapple OS Live & Installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=1G console=ttyS0,115200 console=tty0 quiet splash loglevel=3

LABEL tinapple-fallback
TEXT HELP
Boot tinapple OS live environment with fallback initramfs.
ENDTEXT
MENU LABEL tinapple OS Live & Installer (%ARCH%, BIOS, fallback)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts-fallback.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=1G console=ttyS0,115200 console=tty0 quiet splash loglevel=3
