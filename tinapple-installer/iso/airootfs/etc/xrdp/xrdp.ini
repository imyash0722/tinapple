[Globals]
ini_version=1.0
fork=true
fork_reconnect=true
port=3389
use_vsock=false
tcp_nodelay=true
keepalive=true
security_layer=negotiate
crypt_level=high
certificate=
key_file=
ssl_protocols=TLSv1.2, TLSv1.3
tls_ciphers=HIGH

[Channels]
rdpdr=true
rdpsnd=true
drdynvc=true
cliprdr=true
rail=true

[Logging]
LogFile=/var/log/xrdp.log
LogLevel=INFO

[Security]
crypt_level=high
